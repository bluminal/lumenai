# Synthex — Project Configuration
#
# This is the default configuration for the Synthex plugin.
# To customize for your project, copy this file to:
#   .synthex/config.yaml
# in your project root.
#
# You only need to include sections you want to override.
# Unspecified values use the defaults shown here.
#
# To create this file automatically, run the `init` command.

# -------------------------------------------------------------------
# Review Loop Settings (Global)
# Shared defaults for all commands that run reviewer sub-agents.
# Individual commands can override these under their own section.
# Resolution order: per-command override > global > hardcoded default.
# -------------------------------------------------------------------
review_loops:

  # Maximum review loop iterations before forcing completion.
  # Each cycle: reviewers provide findings → caller fixes → re-review.
  # If unresolved findings remain after max cycles, they are documented
  # in the output (e.g., Open Questions, Summary).
  max_cycles: 2

  # Minimum severity level that must be addressed before exiting the loop.
  # Options: critical, high, medium, low
  # Default "high" means all CRITICAL and HIGH findings must be resolved.
  # WARN-only results (MEDIUM and below) do NOT trigger the loop.
  min_severity_to_address: high

# -------------------------------------------------------------------
# Model Profiles (FR-HM15, D29)
# Resolution order (documented once per agent-spawning command in its
# "Model Resolution" paragraph): --profile flag > models.agents.<name>
# > models.profile delta > the agent's own frontmatter — which IS the
# "balanced" tier (Task 30, FR-HM14 PR-B, pinned it there directly).
# Applied via the Agent tool's per-call `model` override on Claude
# Code; advisory only on other hosts (see hosts.<harness>.models
# below). Standing-pool routing is unaffected: pools never re-spawn,
# so a profile change reaches only freshly spawned agents.
# -------------------------------------------------------------------
models:

  # Active tier. Options: economy | balanced | premium. "balanced"
  # applies no delta at all — it IS the shipped frontmatter.
  profile: balanced

  # Named per-agent overrides — the highest-priority resolution step
  # below the --profile flag. Empty by default. Example:
  #   agents:
  #     code-reviewer:
  #       model: opus
  #       effort: high
  agents: {}

  # economy/premium deltas over the balanced (frontmatter) tier (D29).
  # Only agents that actually change are listed; every agent omitted
  # here keeps its own frontmatter model/effort under either profile.
  profiles:

    # Cost-optimized tier. Every non-Haiku agent is already sonnet at
    # the balanced tier except product-manager/architect (opus); those
    # two stay on opus — downgrading them to sonnet would undercut the
    # exact reasoning quality Task 30 (FR-HM14 PR-B) exists to protect
    # — but drop from effort: high to effort: medium. Haiku-backed
    # utilities are unchanged: they carry no effort key today (Task 7:
    # Claude Code silently ignores effort on Haiku 4.5).
    economy:
      product-manager:
        model: opus     # unchanged
        effort: medium  # was: high
      architect:
        model: opus     # unchanged
        effort: medium  # was: high

    # Quality-optimized tier. product-manager and architect move to
    # Fable ("fable" is the latest-release model alias — Fable 5.1 as
    # of this writing, confirmed directly against `claude --help`'s
    # model-alias table, so the full id `claude-fable-5-1` is not
    # required) at effort: xhigh. security-reviewer stays on sonnet
    # but moves to effort: xhigh for maximum scrutiny on the security
    # gate.
    premium:
      product-manager:
        model: fable    # was: opus
        effort: xhigh   # was: high
      architect:
        model: fable    # was: opus
        effort: xhigh   # was: high
      security-reviewer:
        model: sonnet   # unchanged
        effort: xhigh   # was: high

  # Advisory outside Claude Code (FR-HM15). Claude Code applies
  # models.agents/models.profile directly via the Agent tool's
  # per-call model override and ignores this map entirely. A host
  # that exposes its own per-subagent model selection MAY translate a
  # tier name to a host-native model id via this table; a host that
  # does not just runs every subagent on the session's default model.
  hosts:
    opencode:
      # `provider/model` form (OpenCode's own model-selection syntax).
      models:
        economy: anthropic/claude-haiku-5
        balanced: anthropic/claude-sonnet-5
        premium: anthropic/claude-opus-5-5
    gemini:
      # Gemini CLI tiers: flash | pro | inherit (leave the session
      # model untouched).
      models:
        economy: flash
        balanced: inherit
        premium: pro
    codex:
      # GPT ids or inherit; no Codex model id is verified against a
      # live Codex CLI as of this writing, so every tier inherits the
      # session model rather than guessing an id.
      models:
        economy: inherit
        balanced: inherit
        premium: inherit

# -------------------------------------------------------------------
# Implementation Plan Settings
# Used by the `write-implementation-plan` command
# -------------------------------------------------------------------
implementation_plan:

  # Sub-agents that review the draft implementation plan.
  # Each reviewer provides structured feedback (CRITICAL/HIGH/MEDIUM/LOW)
  # that the Product Manager must address before the plan is finalized.
  #
  # You can:
  #   - Add project-specific reviewers (e.g., security-reviewer, compliance)
  #   - Disable default reviewers by setting enabled: false
  #   - Customize the focus area for each reviewer
  reviewers:
    - agent: architect
      enabled: true
      focus: "Technical architecture, feasibility, NFR coverage, missing technical tasks"

    - agent: designer
      enabled: true
      focus: "Design tasks, UX impact, visual/interaction design clarity"

    - agent: tech-lead
      enabled: true
      focus: "Task clarity, acceptance criteria, parallelizability, dependency accuracy"

  # Maximum number of tasks to recommend for parallel execution per milestone.
  # The PM uses this to size parallelizable work batches in the plan output.
  # Can be overridden per-invocation via the `concurrent_tasks` parameter.
  concurrent_tasks: 3

  # Override: higher max_cycles for high-stakes implementation plans.
  # (Global default is 2; plans get 3 because they affect many downstream tasks.)
  review_loops:
    max_cycles: 3

# -------------------------------------------------------------------
# Refine Requirements Settings
# Used by the `refine-requirements` command
# -------------------------------------------------------------------
refine_requirements:

  # Sub-agents that review the PRD for clarity and completeness.
  # Each reviewer identifies ambiguities, gaps, and unclear areas
  # from their professional perspective.
  reviewers:
    - agent: product-manager
      enabled: true
      focus: "Requirement clarity, acceptance criteria, scope boundaries, success metrics"

    - agent: tech-lead
      enabled: true
      focus: "Technical clarity, implicit assumptions, NFR targets, missing requirements"

    - agent: designer
      enabled: true
      focus: "UX clarity, interaction patterns, accessibility, user flow completeness"

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Code Review Settings
# Used by the `review-code` command
# -------------------------------------------------------------------
code_review:

  # FR-HM16 workflow review engine (Claude Code only, opt-in). "workflow"
  # only takes effect when a Workflow tool is also in the caller's tool
  # list (capability-ladder level 2, docs/standing-pool-routing.md); every
  # other host, and any host missing the tool, keeps running the prose
  # path below. Options: prose | workflow.
  engine: prose

  # Reviewers to run in parallel during code review.
  # code-reviewer and security-reviewer are always recommended.
  # Add performance-engineer for performance-critical codebases.
  reviewers:
    - code-reviewer
    - security-reviewer
    # - performance-engineer  # Uncomment for performance-critical code

  # Maximum diff size (in lines) before warning about review quality.
  # Large diffs produce lower-quality reviews. Google recommends < 300 LOC.
  max_diff_lines: 300

  # Files to read for project conventions (code-reviewer uses these).
  convention_sources:
    - CLAUDE.md
    - .eslintrc
    - .prettierrc

  # Specification paths for compliance checking.
  # The code-reviewer checks code against specifications in these directories.
  spec_paths:
    - docs/specs

  # Size gate (in bytes) for the code-reviewer's inline Specification Relevance
  # Analysis (Step 2). When the total bytes under spec_paths is at or below this,
  # specs are read directly in full; above it, only the first 50 lines of each
  # spec are scanned for relevance before the relevant ones are read in full.
  # Replaces a "spawn a sub-agent" step, which is dead when code-reviewer itself
  # runs as a subagent (subagents cannot spawn subagents on Claude Code).
  spec_inline_bytes: 65536

  # FR-HM17 prose verification pass (D18): code-reviewer, security-reviewer, and
  # performance-engineer each gain a "Verification pass (CRITICAL/HIGH only, top
  # 5)" step that uses an LSP tool (or grep, as a fallback) to check the top 5
  # CRITICAL/HIGH findings before rendering a `- **Verification:**` line in the
  # finding block. Opt-in and off by default (NFR-HM1, NFR-HM3): it changes
  # zero-config output and adds tool calls. Options: prose | off.
  verification: off

  # Additional specialist reviewers (optional).
  # Example: Add a domain-specific reviewer for regulated industries.
  # specialists:
  #   - agent: compliance-reviewer
  #     focus: "Regulatory compliance, audit trail requirements"

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Quality / Testing Settings
# Used by the `test-coverage-analysis` command
# -------------------------------------------------------------------
quality:

  # Coverage thresholds — new code should not drop below these.
  coverage_thresholds:
    line: 80
    branch: 70
    function: 80

  # Test runner to use for coverage reports.
  test_runner: vitest

  # High-priority modules that should always have thorough coverage.
  # Leave empty to auto-detect based on risk (auth, payments, data mutations).
  priority_modules: []

# -------------------------------------------------------------------
# Architecture Settings
# Used by `write-adr` and `write-rfc` commands
# -------------------------------------------------------------------
architecture:

  # Where Architecture Decision Records are stored.
  decisions_path: docs/specs/decisions

  # Where RFCs (Request for Comments) are stored.
  rfcs_path: docs/specs/rfcs

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Design System Settings
# Used by `design-system-audit` command and Design System Agent
# -------------------------------------------------------------------
design_system:

  # Path to the design system specification document.
  # This is the canonical reference for tokens, components, and patterns.
  spec_path: docs/specs/design-system.md

  # Directories to scan during compliance audits.
  scan_paths:
    - src/

  # Design system specialist sub-agents (optional).
  # Add framework-specific specialists for targeted guidance.
  # specialists:
  #   - agent: storybook-expert
  #     focus: "Storybook configuration, story authoring, addon guidance"
  #   - agent: figma-expert
  #     focus: "Design token sync, Figma plugin guidance, handoff workflows"

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Reliability Settings
# Used by `reliability-review` command and SRE Agent
# -------------------------------------------------------------------
reliability:

  # Path to SLO/SLI definitions document.
  slo_document: docs/specs/slos.md

  # Path to operational runbooks directory.
  runbooks_path: docs/runbooks

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Performance Audit Settings
# Used by the `performance-audit` command
# -------------------------------------------------------------------
performance_audit:

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Retrospective Settings
# Used by `retrospective` command
# -------------------------------------------------------------------
retrospective:

  # Where retrospective documents are stored.
  output_path: docs/retros

  # Retrospective format.
  # Options: start-stop-continue, 4ls, sailboat
  format: start-stop-continue

  # Maximum improvement items per cycle.
  # More than 3 competing for attention means none get done.
  max_improvement_items: 3

# -------------------------------------------------------------------
# Next Priority Settings
# Used by the `next-priority` command
# -------------------------------------------------------------------
next_priority:

  # Maximum number of tasks to execute in parallel.
  # Can be overridden per-invocation via the `concurrent_tasks` parameter.
  concurrent_tasks: 3

# -------------------------------------------------------------------
# Worktree Settings
# Used by the `next-priority` command for parallel task execution
# -------------------------------------------------------------------
worktrees:

  # Base directory for git worktrees created during parallel execution.
  # Relative paths resolve from the repository root.
  # Use an absolute path (e.g., /tmp/) to place worktrees outside the repo.
  #
  # Default aligns with Claude Code's own convention (.claude/worktrees/).
  # Ensure this path is in your .gitignore.
  base_path: .claude/worktrees

  # Prefix for worktree branch names.
  branch_prefix: "feature/"

# -------------------------------------------------------------------
# Document Paths
# Default locations for key project documents.
# These can also be overridden via command parameters.
# -------------------------------------------------------------------
documents:
  requirements: docs/reqs/main.md
  implementation_plan: docs/plans/main.md
  specs: docs/specs
  decisions: docs/specs/decisions
  rfcs: docs/specs/rfcs
  runbooks: docs/runbooks
  retros: docs/retros

# ────────────────────────────────────────────────────────────────────────────
# Multi-model review (FR-MR5) — off by default; users opt in via /init or by
# editing this config. When enabled, the orchestrator fans review work out
# across multiple LLM families (OpenAI, Google, local-Ollama) for richer,
# correlation-resistant consolidation. CLI-only (no API keys in Synthex).
# ────────────────────────────────────────────────────────────────────────────
multi_model_review:
  # Master switch. When false, today's native-only review behavior is preserved
  # byte-identically (FR-MR23 regression contract).
  enabled: false

  # Strict mode: when true, preflight failures abort the review. When false,
  # missing CLIs degrade gracefully to whatever proposers are available.
  strict_mode: false

  # When true, native Synthex sub-agents participate alongside external adapters.
  # When false, only externals run. Almost always true — set false only when
  # specifically isolating external behavior.
  include_native_reviewers: true

  # Minimum number of unique families across all configured proposers (counting
  # natives as `anthropic`). Below this, preflight emits a family-diversity
  # warning. Default 2 mirrors PRD recommendation.
  min_family_diversity: 2

  # Minimum number of available proposers required to proceed. Below this,
  # preflight aborts (strict_mode) or emits a critical warning (lenient).
  min_proposers_to_proceed: 2

  # Maximum seconds the orchestrator waits on any single proposer's Task call
  # (FR-MR28, orchestrator Step 4). A timeout surfaces as a per-reviewer error
  # envelope (error_code: timeout), not an orchestrator-level failure — one
  # slow proposer never blocks the rest of the single-batch fan-out.
  per_reviewer_timeout_seconds: 180

  # Context bundle assembly (D5, FR-MR28). The orchestrator assembles this
  # bundle ONCE per invocation via `scripts/assemble-bundle.sh` (FR-HM26;
  # replaces the retired `context-bundle-assembler` agent) and delivers it
  # identically to every proposer (native and external) so no reviewer sees a
  # different artifact, conventions, or specs than the others.
  context:
    # Hard cap on total assembled bundle size (200 KB). If the artifact alone
    # exceeds this, the assembler returns `error_code: narrow_scope_required`
    # instead of summarizing the artifact itself.
    max_bundle_bytes: 204800

    # Per-file cap (64 KB) before a touched file is replaced with a
    # Haiku-produced summary (exports, top-level structure, diff-adjacent
    # regions) rather than sent verbatim.
    max_file_bytes: 65536

    # Project convention files read verbatim into the bundle (orchestrator
    # Step 1 default when unset). Mirrors `code_review.convention_sources`
    # so multi-model and single-model review see the same conventions.
    convention_paths:
      - CLAUDE.md
      - .eslintrc
      - .prettierrc

    # Directories searched for specs matching touched files (filename-
    # substring heuristic, OQ-8). Mirrors `code_review.spec_paths` so
    # multi-model review checks compliance against the same specs.
    spec_paths:
      - docs/specs

  # External proposer adapter list. Each entry references a `*-review-prompter`
  # agent name. Empty list means "natives only" — equivalent to today's review.
  # Adapters not installed at preflight surface as `error_code: cli_missing`.
  reviewers: []
  # Example:
  # reviewers:
  #   - codex-review-prompter      # OpenAI / Codex CLI
  #   - gemini-review-prompter     # Google / gcloud
  #   - ollama-review-prompter     # Local model (qwen, llama, deepseek, etc.)

  # Per-reviewer overrides. Each adapter may override its default model, family
  # tag, or invocation flags. Use the agent name as the key.
  per_reviewer:
    # codex-review-prompter:
    #   model: gpt-5
    #   family: openai
    # ollama-review-prompter:
    #   model: qwen2.5-coder:32b
    #   family: local-qwen

  # Aggregator (consolidation step) configuration.
  aggregator:
    # `auto` resolves via the FR-MR15 strict-total-order tier table (D17),
    # single-sourced below as family-keyed rows (FR-HM28) — the orchestrator
    # (multi-model-review-orchestrator.md Step 2 / 0e) reads `tier_table`
    # rather than hardcoding the chain, though it also documents the same
    # order inline for readability:
    # Claude Opus > GPT-5 > Claude Sonnet > Gemini 2.5 Pro > DeepSeek V3 > Qwen 32B.
    # When the strongest configured proposer is also a reviewer, the aggregator
    # invocation is a separate freshly-spawned CLI call with judge-mode prompt.
    # When no flagship matches, falls back to the host Claude session.
    command: auto

    # D17 strict total-order tier table, highest tier first (tier: 1 wins).
    # `family` matches a proposer's `source.family` (or an external adapter's
    # `per_reviewer.<adapter>.family` override); `model` is advisory (for
    # operator readability and future multi-model-per-family resolution).
    # Override per project to re-rank or add local-model families.
    tier_table:
      - { tier: 1, family: anthropic, model: claude-opus-4-7 }
      - { tier: 2, family: openai, model: gpt-5 }
      - { tier: 3, family: anthropic, model: claude-sonnet-5 }
      - { tier: 4, family: google, model: gemini-2.5-pro }
      - { tier: 5, family: local-deepseek, model: deepseek-v3 }
      - { tier: 6, family: local-qwen, model: qwen-32b }

  # Per-command overrides. Each command can opt in or out independently.
  per_command:
    review_code:
      enabled: false               # When true, /review-code uses multi-model
      complexity_gate:             # FR-MR21a: skip multi-model on trivial diffs
        threshold_lines_changed: 50
        threshold_files_touched: 3
        # Diffs touching these path globs ALWAYS escalate to multi-model:
        always_escalate_paths:
          - "**/auth/**"            # Authentication code — security-critical
          - "**/payments/**"        # Payment flows — financial-critical
          - "**/billing/**"         # Billing logic — financial-critical
          - "**/migrations/**"      # DB migrations — irreversible / data-loss risk
          - "**/security/**"        # Anything in a security namespace
          - "**/secrets/**"         # Secret handling — credential exposure risk
          - "**/crypto/**"          # Crypto code — subtle correctness matters
    write_implementation_plan:
      enabled: false               # When true, plan-review uses multi-model
      # No complexity gate for plan review (FR-MR22): plans are always reviewed.
    team_review:
      enabled: false               # FR-MMT3: when true, /team-review uses multi-model orchestration
      # No complexity gate for team-review (parallels FR-MR22's design for write-implementation-plan):
      # team-review is invoked deliberately for high-risk changes; the user has already opted in

  # Consolidation pipeline configuration.
  consolidation:
    # Stage 2 lexical Jaccard merge threshold (default 0.8 per FR-MR14).
    stage2_jaccard_threshold: 0.8
    # Stage 3 (embedding-based) — Phase 7 follow-up; not active in v1.
    stage3_embedding_threshold: 0.85
    stage4:
      # Per-consolidation hard cap on Stage 4 LLM tiebreaker calls (D18).
      # Prevents N² blow-up when many candidate pairs share buckets.
      max_calls_per_consolidation: 25

  # Per-finding minority-of-one demotion (FR-MR14b).
  minority_of_one:
    enabled: true
    skip_categories: ["security"]   # Security findings never demoted

  # Audit artifact (FR-MR24): per-invocation review record for traceability.
  audit:
    # When true, every multi-model invocation writes an audit file.
    enabled: true
    # Output directory; created if absent. Relative paths resolve against the
    # project root.
    output_path: "docs/reviews/"
    # Where adapters write their raw invocation outputs (one file per call).
    raw_output_path: "docs/reviews/raw/"
    # FR-MMT30a: when true, audit artifact captures per-finding attribution telemetry
    # (consolidated_finding_id, raised_by[], consensus_count, minority_of_one)
    record_finding_attribution_telemetry: true

  # External CLI permission model (ADR-003 / D27).
  # Per-CLI permission mode for external review-prompter adapters.
  # Three patterns:
  #   - read-only       (Pattern 1, default): adapter invokes its CLI with
  #                     read-only / plan-mode / --sandbox flags. The CLI cannot
  #                     edit files, run shell commands, or modify state. Safe
  #                     default for every environment.
  #   - parent-mediated (Pattern 3): adapter invokes its CLI in a mode that
  #                     proxies tool-use approval requests back to the parent
  #                     Claude session (Codex app-server requestApproval,
  #                     Claude Code canUseTool over --output-format stream-json).
  #                     The parent session decides per request. Use this for
  #                     CLIs that natively support approval proxying.
  #   - sandbox-yolo    (Pattern 2): adapter invokes its CLI with full tool
  #                     permissions inside an OS-level sandbox. Faster but
  #                     riskier. Requires explicit user confirmation at spawn.
  #                     Opt in only when you trust the CLI inside the sandbox.
  #
  # Defaults applied per CLI: Codex and Claude Code default to parent-mediated
  # (Pattern 3) because their CLIs natively support approval proxying. All
  # other CLIs default to read-only (Pattern 1) — the universal safe default.
  # Override any entry here per project to opt into sandbox-yolo (Pattern 2)
  # for a specific CLI; the spawning command will require explicit y/N
  # confirmation when sandbox-yolo is configured.
  external_permission_mode:
    # Universal default applied to any CLI not explicitly listed below.
    default: read-only
    #
    # Allowed keys: `default`, plus the bare adapter names listed below
    # (`codex`, `claude`, `gemini`, `bedrock`, `llm`, `ollama`). Any other
    # key in this block is **silently ignored** by the adapters and is
    # never propagated to a shell invocation. The adapter binary names
    # (`which codex`, `which gemini`, `which aws`, etc.) are HARDCODED
    # in each `*-review-prompter` agent's Step 1 (CLI Presence Check) —
    # they are NOT derived from these config-key names. This prevents
    # an adversarial project config from injecting a path-traversal or
    # shell-metacharacter binary name. The Layer 1 schema test
    # `tests/schemas/external-permission-mode-key-validation.test.ts`
    # enforces this allow-list (Task 88 / Phase 11.2 / Security MEDIUM #4).
    #
    # Per-CLI defaults. CLI names are the bare adapter name (the
    # `<cli>-review-prompter` agent file's prefix).
    codex: parent-mediated      # Pattern 3 via `codex app-server` JSON-RPC requestApproval
    claude: parent-mediated     # Pattern 3 via Claude Code `canUseTool` over --output-format stream-json
    gemini: read-only           # Pattern 1 via `--readonly` flag
    bedrock: read-only          # Pattern 1 — `aws bedrock-runtime invoke-model` has no tool-use surface
    llm: read-only              # Pattern 1 — `llm` CLI is a stateless provider-API wrapper
    ollama: read-only           # Pattern 1 — Ollama HTTP API has no tool-use surface

  # Pattern 2 (sandbox-yolo) trust-boundary configuration.
  # Defines the OS-sandbox wrappers used when a CLI is configured for
  # sandbox-yolo. Without these, Pattern 2 has no real sandbox and
  # effectively grants full permissions — Pattern 2-capable adapters
  # MUST verify the configured profile/flags exist before spawning
  # (Step 0 profile-existence check; Task 87 / Phase 11.2).

  # macOS sandbox-exec profile path. Pattern 2 wraps the CLI as
  # `sandbox-exec -f <path> <cli-invocation>`. The shipped default
  # denies network egress, denies file-writes outside /tmp, and limits
  # reads to the current working directory subtree. Override per
  # project to relax or tighten as needed.
  sandbox_profile_path: "plugins/synthex/config/sandbox.sb"

  # Linux bwrap (bubblewrap) flag set. Pattern 2 wraps the CLI as
  # `bwrap <flags> <cli-invocation>`. The shipped default creates a
  # read-only root with a writable /tmp; processes inherit the host's
  # network namespace (set `--unshare-net` to also block network).
  # Override per project to harden or relax. Flags are applied in
  # order; first match wins for overlapping mounts.
  sandbox_bwrap_flags: "--ro-bind / / --bind /tmp /tmp --proc /proc --dev /dev"

# -------------------------------------------------------------------
# Git Settings (FR-HM27, D24)
# Read by scripts/commit-lint.sh, a fail-open PreToolUse hook that lints
# `git commit` subjects on Claude Code and Codex (hooks/codex-hooks.json).
# -------------------------------------------------------------------
git:

  # One of: conventional | issue-key | gitmoji | plain | auto.
  # `auto` (the shipped default) means "not yet sampled, or no single
  # pattern reached a 60% majority" — commit-lint.sh NEVER lints in that
  # case (NFR-HM1: never block on an unconfigured project). `/synthex:init`
  # overwrites this with an explicit value detected from `git log` on every
  # run (FR-HM27); only `conventional` turns linting on.
  commit_convention: auto

# -------------------------------------------------------------------
# Standing Review Pools (FR-HM24, Tasks 47-48)
#
# Folded in from synthex-plus's config/defaults.yaml verbatim. Task 47
# moved the four pool commands (`configure-teams`, `start-review-team`,
# `stop-review-team`, `list-teams`) and the three pool agents into this
# plugin. Task 48 repointed every `standing_pools.*` read (the routing
# doc, the pool commands, and review-code/performance-audit's routing
# gate) at `.synthex/config.yaml` -- this block's presence here is what
# makes that repoint a pure read-site change with no schema migration.
# Every reader falls back to the legacy `.synthex-plus/config.yaml` for
# one major version, printing a deprecation warning when a value only
# resolves there (D6). `configure-teams` writes only `.synthex/config.yaml`
# (D23); it never writes the legacy file.
#
# `start-review-team`, `stop-review-team`, and `list-teams` are gated by
# tool presence (D11): on a host without `SendMessage`/`ListAgents` they
# print `GAP_MESSAGES.pool` (scripts/lib/host-matrix.mjs) instead of
# reading any of this. `configure-teams` is ungated -- it only ever writes
# config, so any host must be able to author this block.
# -------------------------------------------------------------------
standing_pools:
  # Master switch for standing pool functionality.  When false,
  # /start-review-team, /stop-review-team, and /list-teams are still
  # available but pool routing by standard Synthex commands does not
  # occur.  Default: false (opt-in).
  enabled: false

  # TTL: minimum idle time (in minutes) before a standing pool becomes
  # eligible for shutdown via lazy enforcement.  "Idle" = the pool's
  # task list has been continuously empty (no pending or in_progress
  # tasks) for this duration.
  #
  # Lazy enforcement: TTL expiry does NOT trigger an automatic shutdown.
  # Pools may outlive their nominal TTL until the next discovery event
  # (a /list-teams call or any standard Synthex command performing pool
  # routing) observes the expiry and reaps the pool.  See FR-MMT13 for
  # the full discovery-time cleanup contract.
  #
  # Set to 0 to disable TTL-based reaping entirely (pool only stops via
  # /stop-review-team or by host-level process death, which is then
  # reaped by stale-pool cleanup at next discovery).  Default: 60 min.
  ttl_minutes: 60

  # Default pool name used by /start-review-team when --name is not
  # provided.  Must satisfy the name validation regex:
  # ^[a-z0-9][a-z0-9-]{0,47}$  (D18).  Default: "review-pool".
  default_name: review-pool

  # Default reviewer roster for /start-review-team when --reviewers is
  # not provided.  List of Synthex agent names.  Chosen to match
  # standard Synthex's code_review.reviewers default so that /review-code
  # pool-routing hits succeed out of the box.  Default: two reviewers.
  default_reviewers:
    - code-reviewer
    - security-reviewer

  # Default for whether to enable Feature A (multi-model) when starting
  # a pool.  When true, /start-review-team without --multi-model still
  # spawns with multi-model enabled.  When false, must pass --multi-model
  # explicitly to activate Feature A on the pool.  Default: false.
  default_multi_model: false

  # Storage namespace for standing pools.  Pools live under
  # teams/standing/ to separate them from per-invocation teams.
  # Tasks live in tasks/standing/.  Mailboxes at
  # teams/standing/<name>/inboxes/.
  #
  # NOT user-configurable in v1 — these paths form the discovery
  # convention (D6).  Changing them would break cross-session routing.
  storage_root: ~/.claude/teams/standing
  tasks_root: ~/.claude/tasks/standing

  # Routing semantics: controls what happens when a standard Synthex
  # command (e.g., /review-code) looks for a matching pool.
  #
  # "prefer-with-fallback"    — when a matching pool exists, route to it;
  #                             otherwise spawn fresh sub-agents (today's
  #                             behavior).  Silent fallback.  Default.
  # "explicit-pool-required"  — when a matching pool exists, route to it;
  #                             when no matching pool exists, the command
  #                             aborts with a "no matching pool" error and
  #                             a hint to run /start-review-team.  For
  #                             users who want to enforce pool usage and
  #                             catch misconfigurations.
  routing_mode: prefer-with-fallback

  # Roster matching: which reviewers must be present in a pool's roster
  # for it to be considered a match for the command's requested roster.
  #
  # "covers"  — pool roster is a superset of the command's required
  #             reviewers (e.g., a pool with [code-reviewer,
  #             security-reviewer, performance-engineer] matches a
  #             command requesting [code-reviewer, security-reviewer]).
  # "exact"   — pool roster must equal the command's required reviewers
  #             exactly (both sets identical).  Default: covers.
  matching_mode: covers

# -------------------------------------------------------------------
# Lifecycle Settings (cross-cutting, not pool-specific)
#
# These settings govern submission and polling behavior for any command
# that submits work to a standing pool.  They are top-level siblings of
# standing_pools: (D23) -- NOT nested inside standing_pools.lifecycle --
# because they apply to the submitting command session, not to the pool.
# Verbatim from synthex-plus's defaults.yaml (same D23 layout).
# -------------------------------------------------------------------
lifecycle:
  # Maximum seconds a submitting command session will poll the pool's
  # task list waiting for a result before timing out and falling back.
  # Applies to /review-code, /performance-audit, and any future command
  # that supports pool routing (FR-MMT16a).  Default: 300 seconds (5 min).
  submission_timeout_seconds: 300

# -------------------------------------------------------------------
# Lifecycle Hooks: TaskCompleted / TeammateIdle (FR-HM23, Task 50)
#
# scripts/task-completed-gate.sh and scripts/teammate-idle-gate.sh are real
# command hooks (hooks/hooks.json) that exit 2 to block/redirect and exit 0
# to allow. Both are gated on standing_pools.enabled above via
# scripts/lib/config-get.sh: when pools are disabled, unconfigured, or node
# is unavailable, both hooks no-op (exit 0) so they stay silent for Agent
# Teams sessions that have nothing to do with Synthex.
#
# Only the two `enabled` switches and `allow_cross_functional` are read from
# config -- scripts/lib/config-get.sh's documented YAML subset (D26) does
# not parse flow lists (`[a, b]`), so the reviewers-by-work-type routing
# table below is illustrative only; the scripts hardcode the same table as
# their single source of truth (see each script's header comment). Ported
# from synthex-plus's config/defaults.yaml (Tasks 27/28 era); the
# `auto_reopen_on_fail` key from that version is dropped here because a
# command hook has no model turn in which to reopen a task or evaluate a
# reviewer verdict -- see task-completed-gate.sh's header for what changed.
# -------------------------------------------------------------------
hooks:
  # Fires when a teammate marks a task as completed. The review gate
  # classifies the work type and names the reviewers that must see it
  # before the task is re-marked complete.
  task_completed:
    review_gate:
      enabled: true

      # Illustrative only -- see the note above. The authoritative table
      # lives in scripts/task-completed-gate.sh.
      reviewers:
        code: [code-reviewer, security-reviewer]
        frontend: [code-reviewer, security-reviewer, design-system-agent]
        infrastructure: [code-reviewer, terraform-plan-reviewer]

  # Fires when a teammate has no assigned tasks and is idle.
  teammate_idle:
    work_assignment:
      enabled: true

      # Whether idle teammates can pick up tasks outside their role when no
      # role-matching unblocked task exists. When false, a frontend
      # teammate is only ever pointed at frontend tasks.
      allow_cross_functional: false
