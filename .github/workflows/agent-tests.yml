# Synthex — Agent Testing Pipeline
#
# Three-tier CI pipeline matching the testing pyramid:
#   1. Schema Validation  — Every PR, instant, zero LLM cost
#   2. Behavioral Tests   — Manual trigger only, cached LLM outputs
#   3. Semantic Evaluation — Manual trigger only, LLM-as-judge rubrics
#
# All layers beyond schema validation are manual-only to control costs.
# The cache layer ensures behavioral tests only call the LLM when the agent
# definition or fixture has changed. All subsequent runs use cached outputs.

name: Agent Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main, 'harness/**']
  push:
    branches: [main, 'harness/**']
  workflow_dispatch:
    inputs:
      run_behavioral:
        description: 'Run behavioral assertions (Layer 2)'
        type: boolean
        default: false
      run_semantic:
        description: 'Run semantic evaluation (Layer 3, LLM-as-judge)'
        type: boolean
        default: false
      run_plugin_eval:
        description: 'Run the plugin eval suite (FR-HM34, claude plugin eval)'
        type: boolean
        default: false

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Layer 1: Schema Validation (every PR, instant, free)
  # ─────────────────────────────────────────────────────────────────
  schema-validation:
    name: "Layer 1: Schema Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run schema tests
        run: npx vitest run schemas/

  # ─────────────────────────────────────────────────────────────────
  # Layer 1b: Isolated Harness Compatibility (every PR, no model cost)
  # ─────────────────────────────────────────────────────────────────
  compatibility-offline:
    name: "Compatibility: ${{ matrix.harness }} offline"
    needs: schema-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, gemini, opencode]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Run isolated offline compatibility test
        working-directory: tests
        env:
          SYNTHEX_COMPAT_BUILD_CACHE: gha
          SYNTHEX_COMPAT_CACHE_SCOPE: synthex-compat-offline-${{ matrix.harness }}
        run: >-
          node compat/scripts/run-suite.mjs
          --profile offline
          --harness ${{ matrix.harness }}
          --report-dir "$RUNNER_TEMP/synthex-compat-report"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthex-compat-offline-${{ matrix.harness }}
          path: ${{ runner.temp }}/synthex-compat-report/
          if-no-files-found: warn

  compatibility-activation:
    name: "Compatibility: ${{ matrix.harness }} activation"
    needs: schema-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, gemini, opencode]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Run isolated activation compatibility test
        working-directory: tests
        env:
          SYNTHEX_COMPAT_BUILD_CACHE: gha
          SYNTHEX_COMPAT_CACHE_SCOPE: synthex-compat-activation-${{ matrix.harness }}
        run: >-
          node compat/scripts/run-suite.mjs
          --profile activation
          --harness ${{ matrix.harness }}
          --report-dir "$RUNNER_TEMP/synthex-compat-report"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthex-compat-activation-${{ matrix.harness }}
          path: ${{ runner.temp }}/synthex-compat-report/
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # Layer 2: Behavioral Assertions (manual trigger only)
  # ─────────────────────────────────────────────────────────────────
  behavioral-assertions:
    name: "Layer 2: Behavioral Assertions"
    needs: schema-validation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_behavioral == 'true'
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Restore LLM output cache from previous runs
      - name: Restore LLM cache
        uses: actions/cache@v5
        with:
          path: tests/.cache
          key: llm-cache-${{ hashFiles('plugins/synthex/agents/**', 'tests/fixtures/**') }}
          restore-keys: |
            llm-cache-

      - name: Run behavioral tests
        run: npx promptfoo eval --config promptfoo.config.yaml --filter-pattern "B[0-9]"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ─────────────────────────────────────────────────────────────────
  # Layer 3: Semantic Evaluation (manual trigger only)
  # ─────────────────────────────────────────────────────────────────
  semantic-evaluation:
    name: "Layer 3: Semantic Evaluation"
    needs: schema-validation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_semantic == 'true'
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Restore LLM output cache
      - name: Restore LLM cache
        uses: actions/cache@v5
        with:
          path: tests/.cache
          key: llm-cache-${{ hashFiles('plugins/synthex/agents/**', 'tests/fixtures/**') }}
          restore-keys: |
            llm-cache-

      - name: Run full evaluation (behavioral + semantic)
        run: npx promptfoo eval --config promptfoo.config.yaml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ─────────────────────────────────────────────────────────────────
  # Plugin Eval Suite (manual trigger only; FR-HM34, Task 27)
  #
  # `claude plugin eval` runs the 18 planted-issue cases under
  # plugins/synthex/evals/ (direct-agent dispatch via the Agent tool,
  # deterministic regex/tool_used graders only — no LLM or baseline
  # grader ever gates, per FR-HM34). tests/scripts/run-evals.mjs is a
  # hash-keyed skip wrapper: it only pays for a case whose agent
  # prompt or fixture actually changed since the last run in the
  # restored tests/.eval-cache/.
  # ─────────────────────────────────────────────────────────────────
  plugin-eval:
    name: "Plugin Eval Suite (FR-HM34)"
    needs: schema-validation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_plugin_eval == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      # Restore the wrapper's hash-keyed results cache from previous runs.
      # A case is only re-run (and re-billed) when its agent prompt or
      # fixture content has changed since the cache entry was written.
      - name: Restore eval results cache
        uses: actions/cache@v5
        with:
          path: tests/.eval-cache
          key: eval-cache-${{ hashFiles('plugins/synthex/agents/**', 'tests/fixtures/**', 'tests/scripts/eval-cases.json') }}
          restore-keys: |
            eval-cache-

      - name: Verify generated eval cases are up to date
        run: node tests/scripts/generate-evals.mjs --check

      - name: Run plugin eval suite
        run: node tests/scripts/run-evals.mjs --threshold 0.67
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthex-plugin-eval-report
          path: |
            tests/.eval-cache/reports/
            plugins/synthex/evals/results/
          if-no-files-found: warn
